server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entry point must be revalidated on every load: it references
    # content-hashed asset files that disappear with the next deployment, so a
    # heuristically cached copy would point at files the server no longer has.
    # "no-cache" still allows cheap 304 responses via ETag. This also covers
    # SPA routes, which try_files serves as /index.html via internal redirect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Served from a tmpfs mount, not the (read-only in production) webroot -
    # see docker/docker-entrypoint.d/40-generate-runtime-config.sh.
    location = /config.js {
        alias /run/vb-config/config.js;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
