server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Served from a tmpfs mount, not the (read-only in production) webroot -
    # see docker/docker-entrypoint.d/40-generate-runtime-config.sh.
    location = /config.js {
        alias /run/vb-config/config.js;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
