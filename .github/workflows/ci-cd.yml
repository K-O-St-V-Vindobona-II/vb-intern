name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check code style (ESLint)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check

  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run vue-tsc (Strict Type Checking)
        run: npm run type-check
      - name: Run Test Suite & Coverage
        run: npm run test:coverage

  security:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  smoke-test-readonly:
    name: Read-Only Rootfs Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: vb-intern:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the Quadlet hardening applied in the deploy repo's
      # templates: read-only rootfs and every capability dropped. The image
      # runs nginx-unprivileged (uid 101 for master and workers, port 8080),
      # so no capability is added back. nginx keeps its PID file and temp
      # directories under /tmp, which Docker does not mount writable on a
      # read-only rootfs by itself, hence the explicit tmpfs. Proves the
      # image actually boots and serves the runtime-rendered config.js under
      # those constraints instead of just assuming it from reading the code.
      - name: Boot the container read-only
        run: |
          docker run -d --name vb-intern-smoke \
            --read-only --cap-drop=all --security-opt no-new-privileges \
            --tmpfs /run:mode=1777 \
            --tmpfs /tmp:mode=1777 \
            -p 8090:8080 \
            -e API_BASE_URL=https://api.example.test \
            -e PASSWORD_MIN_LENGTH=12 \
            -e APP_ENVIRONMENT=test \
            vb-intern:smoke-test

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8090/ -o /dev/null; then
              echo "Container is up after ${i}s"
              break
            fi
            sleep 1
          done

          echo "--- index page ---"
          curl -sf http://localhost:8090/ -o /dev/null -w "HTTP %{http_code}\n"
          echo "--- rendered config.js ---"
          curl -sf http://localhost:8090/config.js
          curl -sf http://localhost:8090/config.js | grep -q "https://api.example.test"

          echo "--- container logs ---"
          docker logs vb-intern-smoke

          # nginx's stock docker-entrypoint.d hooks log a benign
          # "can not modify ... (read-only file system?)" info line when
          # they skip a config tweak on the read-only webroot - only match
          # nginx's own fatal-severity tags plus a generic EROFS/OSError,
          # not that expected info-level message.
          if docker logs vb-intern-smoke 2>&1 | grep -qi "\[emerg\]\|\[alert\]\|EROFS"; then
            echo "Found a fatal read-only/permission error in the container log"
            exit 1
          fi

          docker rm -f vb-intern-smoke

      # config.js is executable JavaScript built from four environment variables: the entrypoint
      # has to refuse a value that is missing, malformed or could end the string it is written
      # into. The first run is the positive control, so a refusal below cannot come from the
      # container setup instead of the value.
      - name: Refuse bad runtime values
        run: |
          base=(
            "API_BASE_URL=https://api.example.test"
            "GOOGLE_CLIENT_ID=client-1.apps.googleusercontent.com"
            "PASSWORD_MIN_LENGTH=12"
            "APP_ENVIRONMENT=test"
          )

          # "nginx -t" only tests the configuration, but the image's entrypoint runs its hooks
          # first, and only for a command that starts with "nginx".
          start() {
            local override="$1" args=() pair
            for pair in "${base[@]}"; do
              [ "${pair%%=*}" = "${override%%=*}" ] || args+=(-e "$pair")
            done
            [ -z "$override" ] || args+=(-e "$override")
            docker run --rm --read-only --cap-drop=all \
              --tmpfs /run:mode=1777 --tmpfs /tmp:mode=1777 \
              "${args[@]}" vb-intern:smoke-test nginx -t >/dev/null 2>&1
          }

          start "" || { echo "The container did not start with valid values"; exit 1; }

          for bad in \
            "API_BASE_URL=" "API_BASE_URL=api.example.test" "API_BASE_URL=https://x.test/a'b" \
            "API_BASE_URL=https://x.test/a b" 'API_BASE_URL=https://x.test/$(id)' \
            "GOOGLE_CLIENT_ID=a'b" "GOOGLE_CLIENT_ID=a b" \
            "PASSWORD_MIN_LENGTH=" "PASSWORD_MIN_LENGTH=twelve" "PASSWORD_MIN_LENGTH=0" \
            "APP_ENVIRONMENT=" "APP_ENVIRONMENT=staging"; do
            if start "$bad"; then
              echo "The container started with ${bad}"
              exit 1
            fi
          done

  release-image:
    name: Build & Push Image
    needs: [lint, quality, security, smoke-test-readonly]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a push that landed on main, or a manual dispatch run against main,
    # may publish :latest. A scheduled run only refreshes the CodeQL scan and
    # must never release, and neither may a run on any other branch, because the
    # production Quadlet pulls :latest automatically.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/k-o-st-v-vindobona-ii/vb-intern:latest
            ghcr.io/k-o-st-v-vindobona-ii/vb-intern:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
