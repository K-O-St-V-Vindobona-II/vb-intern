name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check code style (ESLint)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check

  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run vue-tsc (Strict Type Checking)
        run: npm run type-check
      - name: Run Test Suite & Coverage
        run: npm run test:coverage

  security:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  smoke-test-readonly:
    name: Read-Only Rootfs Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: vb-intern:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the Quadlet hardening applied in the deploy repo's
      # templates: read-only rootfs, nginx's master-to-worker privilege
      # drop needs CAP_CHOWN/CAP_SETUID/CAP_SETGID beyond CAP_NET_BIND_SERVICE
      # (binding port 80 as root). Proves the image actually boots and
      # serves the runtime-rendered config.js under those constraints
      # instead of just assuming it from reading the code.
      - name: Boot the container read-only
        run: |
          docker run -d --name vb-intern-smoke \
            --read-only --cap-drop=all --security-opt no-new-privileges \
            --cap-add=CAP_NET_BIND_SERVICE --cap-add=CAP_CHOWN \
            --cap-add=CAP_SETUID --cap-add=CAP_SETGID \
            --tmpfs /run:mode=1777 \
            --tmpfs /var/cache/nginx:mode=0755 \
            -p 8090:80 \
            -e API_BASE_URL=https://api.example.test \
            -e PASSWORD_MIN_LENGTH=12 \
            -e APP_ENVIRONMENT=test \
            vb-intern:smoke-test

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8090/ -o /dev/null; then
              echo "Container is up after ${i}s"
              break
            fi
            sleep 1
          done

          echo "--- index page ---"
          curl -sf http://localhost:8090/ -o /dev/null -w "HTTP %{http_code}\n"
          echo "--- rendered config.js ---"
          curl -sf http://localhost:8090/config.js
          curl -sf http://localhost:8090/config.js | grep -q "https://api.example.test"

          echo "--- container logs ---"
          docker logs vb-intern-smoke

          # nginx's stock docker-entrypoint.d hooks log a benign
          # "can not modify ... (read-only file system?)" info line when
          # they skip a config tweak on the read-only webroot - only match
          # nginx's own fatal-severity tags plus a generic EROFS/OSError,
          # not that expected info-level message.
          if docker logs vb-intern-smoke 2>&1 | grep -qi "\[emerg\]\|\[alert\]\|EROFS"; then
            echo "Found a fatal read-only/permission error in the container log"
            exit 1
          fi

          docker rm -f vb-intern-smoke

  release-image:
    name: Build & Push Image
    needs: [lint, quality, security, smoke-test-readonly]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/k-o-st-v-vindobona-ii/vb-intern:latest
            ghcr.io/k-o-st-v-vindobona-ii/vb-intern:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
